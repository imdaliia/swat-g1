             <!-- SECTION 1: INTRODUCTION

Touch targets are the areas of a mobile interface
that users interact with by tapping their fingers.

They include buttons, links, icons and checkboxes.

Bad touch targets occur when these interactive
elements are too small, too close together or
difficult to select accurately.

On mobile devices, users interact with their
fingers instead of a mouse. Therefore, buttons
and other interactive elements must be large
enough and properly spaced.

Poorly designed touch targets can lead to
accidental clicks, navigation errors and
a frustrating user experience.

-->


<!-- SECTION 2: CASE STUDY - EVEREYE

Cookie consent interfaces allow users to choose
whether they accept or reject the use of cookies
on a website.

The EverEye example illustrates a cookie consent
interface in which the reject option appears
particularly small compared with other options.

This creates a usability problem because users
may have difficulty selecting the desired option
with their fingers.

Small interactive areas can also increase the
risk of accidentally selecting a neighbouring
button.

This example highlights the importance of
designing touch targets that are easy to use
and accessible on mobile devices.

IMAGE:

<!-- SECTION 3: WHY ARE SMALL TOUCH TARGETS A PROBLEM?

1. SMALL TOUCH AREAS

Buttons that are too small can be difficult
to select accurately on a touchscreen.

2. ACCIDENTAL CLICKS

When interactive elements are placed too close
together, users may accidentally select
the wrong option.

3. ACCESSIBILITY DIFFICULTIES

Small touch targets can create additional
challenges for people with motor impairments
or limited finger control.

4. USER FRUSTRATION

Repeated mistakes can make navigation slower
and create a frustrating experience.

-->


<!-- SECTION 4: DESIGN GUIDELINES

Several design guidelines provide recommendations
for making mobile interfaces easier to use.

APPLE HUMAN INTERFACE GUIDELINES

Apple generally recommends touch targets
of at least 44 x 44 points.

MATERIAL DESIGN

Google Material Design recommends touch targets
of at least 48 x 48 density-independent pixels (dp).

WCAG 2.2

The WCAG 2.2 success criterion 2.5.8,
Target Size (Minimum), generally requires
targets to measure at least 24 x 24 CSS pixels,
subject to specific exceptions.

These recommendations help designers create
more accessible and comfortable mobile interfaces.

-->


<!-- SECTION 5: HOW CAN TOUCH TARGETS BE IMPROVED?

Designers can improve mobile touch interfaces
by following several principles:

1. LARGER TOUCH AREAS

Interactive elements should have sufficient
dimensions to be selected comfortably.

2. BETTER SPACING

Buttons should have enough distance between
them to reduce accidental clicks.

3. CLEAR VISUAL HIERARCHY

Important actions should be easy to identify.

4. ACCESSIBLE CHOICES

Options such as Accept and Reject should
both be easy to find and select.

5. CONSISTENT DESIGN

Interactive elements should follow consistent
sizes and spacing throughout the interface.

-->


<!-- SECTION 6: CONCLUSION

Bad touch targets demonstrate how small design
decisions can have a significant impact
on mobile usability.

Buttons and links that are too small or
too close together can make interfaces
difficult to navigate.

By following accessibility guidelines,
using appropriate touch target sizes and
providing sufficient spacing, designers
can create more inclusive and user-friendly
mobile experiences.

-->
