     Title idea: "Built to keep you scrolling"

     P1 (intro)
     Most of the apps on our phones are free. They earn money from
     advertising, so the longer we stay, the more they earn (see the
     persuasion page). This page looks at the small design choices
     that make it hard to put the phone down: features that look
     harmless on their own, but together remove every natural moment
     to stop.

     P2 (infinite scroll)
     Infinite scroll adds new content to the bottom of the page while
     you are still reading, so the page seems to never end. Before it,
     most websites used pagination: content was split into separate
     pages and you had to click "next". The difference looks small,
     but the end of a page is a "stopping cue", a moment where you
     decide whether to go on. Infinite scroll removes that moment, and
     research has linked it to smartphone and social media addiction
     (Noe et al. 2019; Purohit et al. 2020) [https://en.wikipedia.org/wiki/Infinite_scrolling].

     [IMAGE: aza-raskin.jpg, next to P3 + P4]

     P3 (Aza Raskin)
     The designer most often credited with infinite scroll is Aza
     Raskin, who says he came up with it in 2006. Its origin is
     disputed: the same year, a Microsoft image search team filed a
     patent for a similar idea [https://en.wikipedia.org/wiki/Infinite_scrolling]. Raskin, son of Jef Raskin (who
     started the Macintosh project at Apple), worked on user interfaces
     at his own company Humanized and later at Mozilla [https://en.wikipedia.org/wiki/Aza_Raskin]. He says he
     built infinite scroll "before social media got going, really as a
     technology to help people", and explained it to Twitter, Google
     and other companies [https://thepublicsradio.org/stories/why-infinite-scrolls-inventor-wants-to-kill-his-creation/].

     P4 (regret)
     Today Raskin is one of its strongest critics. He sums up what went
     wrong in three words: "incentives eat intentions". A feature
     meant to save people a click became a way to keep them scrolling,
     because attention is what advertising-based companies sell. It
     affected him too: "I actually had to write software to break my
     own addiction". He later co-founded the Center for Humane
     Technology (see the alternatives page) [https://en.wikipedia.org/wiki/Aza_Raskin], and in 2026 he
     testified in a New Mexico trial against Meta, telling the jury
     "this is not a fair fight". He points out that on the other side
     there are "thousands of engineers who have done hundreds of
     millions of tests" on users' psychology [https://thepublicsradio.org/stories/why-infinite-scrolls-inventor-wants-to-kill-his-creation/].

     [IMAGE: slot-machines.jpg, next to P5]

     P5 (slot machine and variable rewards)
     Pull-to-refresh is often compared to a slot machine: you pull, you
     wait a second, and you never know what you will get. Tristan
     Harris described it like this: "Every time I check my phone, I'm
     playing the slot machine to see, 'What did I get?'" [https://en.wikipedia.org/wiki/Center_for_Humane_Technology].
     Psychologists call this a variable reward. B. F. Skinner studied
     it with rats and pigeons: when the reward came after an
     unpredictable number of tries, the animals kept responding at a
     very high, persistent rate, and behaviour rewarded only some of
     the time was slower to disappear than behaviour rewarded every
     time [https://en.wikipedia.org/wiki/Operant_conditioning].
     Nir Eyal's Hook Model builds on the same idea (see the persuasion
     page).

     P6 (other mechanics)
     Infinite scroll is not the only one. Autoplay starts the next
     episode after a few seconds unless you act, so stopping becomes
     the active decision. A University of Chicago study on Netflix
     found that people with autoplay on watched more overall
     [https://news.uchicago.edu/story/uchicago-scientists-study-hidden-cost-netflixs-autoplay].
     Snapchat streaks count how many days in a row two friends have
     sent each other a snap, and teenagers talk a lot about starting,
     keeping and losing them [https://oars.uos.ac.uk/2901]. A 2023
     survey of 2,483 young teenagers in Belgium found that taking part
     in streaks was associated with problematic smartphone use
     [https://doaj.org/article/7e7e45c958c74b29ba203607b6f4a840].
     Notifications and red badges call you back even when the app is
     closed (see the home screen screenshot on the alternatives page).
     Like counts turn every post into a public score. In spring 2019
     Instagram started testing hiding them in Canada, and in July 2019
     extended the test to Australia, Brazil, Ireland, Italy, Japan and
     New Zealand [https://www.engadget.com/2019/07/18/instagram-expanding-hidden-like-test/].

     P7 (what could change)
     Raskin's proposed fixes are simple: add friction back ("It's
     literally like adding speed bumps to a road"), click for the next
     page instead of scrolling forever, and no autoplay videos. He
     compares opposition to these changes with the past opposition to
     seat belts. He also warns about what comes next: "the race to
     attention becomes the race to intimacy", with AI companions
     competing for people, especially children [https://thepublicsradio.org/stories/why-infinite-scrolls-inventor-wants-to-kill-his-creation/].
