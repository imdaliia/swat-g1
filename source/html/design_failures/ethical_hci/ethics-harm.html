     Title idea: "The cost for users"

     P1 (intro)
     If apps are designed to capture as much attention as possible,
     what does that cost the people who use them, especially young
     people? In the last few years whistleblowers, researchers,
     governments and courts have tried to answer. The answer is still
     debated, so this page presents both the evidence and the doubts.

     [IMAGE: frances-haugen.jpg, next to P2]

     P2 (Frances Haugen)
     Frances Haugen is a data engineer who worked at Facebook from June
     2019 to May 2021, in the civic integrity team. She gave tens of
     thousands of internal Facebook documents to the US Securities and
     Exchange Commission and to The Wall Street Journal. She revealed her identity on CBS "60 Minutes"
     on 3 October 2021, and two days later she testified to the US
     Senate, saying that Facebook "won't make the necessary changes
     because they have put their astronomical profits before people".
     She later spoke to the UK and European Parliaments too [https://en.wikipedia.org/wiki/Frances_Haugen].

     P3 (The Facebook Files)
     From September 2021 the Wall Street Journal published the
     documents in a series called "The Facebook Files". One
     headline said: "Facebook Knows Instagram is Toxic for Teen Girls,
     Company Documents Show". Facebook had studied the effect of
     Instagram on young users since 2018, and its internal research said:
     "we make body issues worse for one in three teenage girls".
     Boys were affected too: 14% of US teen boys reported negative
     social comparison. Shortly after, the company paused its
     planned "Instagram for Kids". Facebook replied that the
     articles mischaracterised its research [https://en.wikipedia.org/wiki/2021_Facebook_leak].

     P4 (The Anxious Generation)
     In 2024 the psychologist Jonathan Haidt published "The Anxious
     Generation". He argues that teen mental health got sharply
     worse between 2010 and 2015, when smartphones spread, because a
     "play-based childhood" was replaced by a "phone-based childhood".
     He names four harms: social deprivation, sleep deprivation,
     attention fragmentation and addiction. His proposals are
     phone-free schools, more free play, smartphones later and social
     media only from 16. The book has been a bestseller for more
     than two years [https://en.wikipedia.org/wiki/The_Anxious_Generation].

     P5 (the other side)
     Many researchers disagree. In a review in Nature
     [https://www.nature.com/articles/d41586-024-00902-2], the psychologist
     Candice Odgers wrote that most studies do not find a large,
     consistent negative effect, and that the link might go the other
     way: unhappy teenagers may simply use social media more. Amy
     Orben and Andrew Przybylski have also found that the link between
     smartphones and wellbeing is weak, and some critics speak of a
     "moral panic". Haidt replied by pointing to experimental
     studies [https://en.wikipedia.org/wiki/The_Anxious_Generation]. The scientific question is still open.

     [IMAGE: social-media-addiction.jpg, small, next to P6]

     P6 (Australia's ban)
     Governments have not waited for the debate to end. Australia
     passed a law in November 2024, partly inspired by Haidt's book
     [https://en.wikipedia.org/wiki/The_Anxious_Generation], and since 10 December 2025 people under 16 cannot have an
     account on platforms such as Facebook, Instagram, TikTok,
     Snapchat, X, YouTube and Reddit. Platforms that do not take
     "reasonable steps" risk fines of up to 49.5 million Australian
     dollars, while children and parents are not punished. Critics
     worry about the privacy of age checks and called the law a "20th
     Century response to 21st Century challenges" [https://en.wikipedia.org/wiki/Online_Safety_Amendment_(Social_Media_Minimum_Age)_Act_2024].

     P7 (courts and other countries)
     The question has also reached the courts. In 2026 two US juries
     found against the companies over addictive design: 6 million
     dollars in California, against Meta and Google, and 375 million
     dollars in New Mexico, against Meta; the companies said they will
     appeal. Other countries, including India, Indonesia, Denmark,
     Spain and France, are moving towards limits for children too [https://thepublicsradio.org/stories/why-infinite-scrolls-inventor-wants-to-kill-his-creation/].

     P8 (conclusion)
     Scientists do not agree that social media causes a mental health
     crisis. But the companies' own research, the courts and many
     governments show that the concern is taken seriously. The last
     page asks what designers, and users, can do differently.
