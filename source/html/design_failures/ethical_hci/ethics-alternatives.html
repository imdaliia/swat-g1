     Title idea: "Designing ethically"

     P1 (intro)
     If design is part of the problem, it can also be part of the
     solution. This page presents the people who started asking
     designers to respect users' attention, a method to put human
     values into design, and some concrete good practices.

     [IMAGE: tristan-harris.jpg, next to P2]

     P2 (Tristan Harris at Google)
     Tristan Harris studied at Stanford, where he took a class with
     B. J. Fogg (see the persuasion page). In 2011 Google bought his
     startup Apture, and in February 2013, while working there, he made
     a 141-slide presentation called "A Call to Minimize Distraction &
     Respect Users' Attention". He shared it with a few colleagues;
     in the end it was seen by tens of thousands of Google employees.
     His message was that companies like Google, Apple and
     Facebook should "feel an enormous responsibility" [https://en.wikipedia.org/wiki/Tristan_Harris].

     P3 (Time Well Spent and the Center for Humane Technology)
     Harris introduced "Time Well Spent", an idea he co-created with
     James Williams and Joe Edelman, at TEDx Brussels in 2014. In December
     2015 he left Google to work on it full time [https://en.wikipedia.org/wiki/Tristan_Harris]. Time Well Spent
     (2015) became the Center for Humane Technology in 2018, a non-profit
     in San Francisco founded by Harris, Aza Raskin (see the mechanics
     page) and Randima Fernando. For CHT the root cause is the
     business model based on attention, which Harris calls "a race to
     the bottom of the brain stem". CHT works in three directions:
     awareness of manipulative design, policy, and better design, for
     example removing dark patterns [https://www.humanetech.com/social-media-society]. Since 2023 it also works on the
     risks of AI [https://en.wikipedia.org/wiki/Center_for_Humane_Technology].

     P4 (impact: TED and The Social Dilemma)
     After Harris's TED talk in 2017, Facebook, Instagram, YouTube and
     Google added tools to monitor time spent, such as Screen Time.
     In 2020 Netflix released "The Social Dilemma", a documentary by
     Jeff Orlowski in which Harris and other CHT members were
     interviewed. In the film he says: "Never before in history have fifty designers made decisions
     that would have an impact on two billion people." [https://en.wikipedia.org/wiki/Tristan_Harris] It was
     watched by 38 million households in its first month [https://en.wikipedia.org/wiki/Center_for_Humane_Technology].

     P5 (Value Sensitive Design)
     Designers also have methods to do things differently. Value
     Sensitive Design, developed by Batya Friedman and Peter Kahn at the
     University of Washington, is "a theoretically grounded approach to
     the design of technology that accounts for human values in a
     principled and comprehensive manner". It works in three kinds
     of investigation, repeated in cycles: conceptual (who are the
     stakeholders, which values matter, where they conflict), empirical
     (what real users value and need) and technical (how to design the
     system to support those values). Typical values are well-being,
     privacy, autonomy, fairness, trust and informed consent [https://en.wikipedia.org/wiki/Value_sensitive_design].

     P6 (ACM Code of Ethics)

     [IMAGE: all-caught-up.png, narrow, next to P7]

     P7 (good practices: stopping cues)
     Some good practices are simple. In July 2018 Instagram added a
     message that says "You're All Caught Up" when you have seen all new
     posts from the past 2 days [https://about.instagram.com/blog/announcements/introducing-youre-all-caught-up-in-feed]. It is a stopping cue: exactly the
     natural moment to stop that infinite scroll had removed (see the
     mechanics page). Another good practice is an easy way out: leaving
     should be as easy as joining. In October 2024 the US Federal Trade
     Commission adopted a "click-to-cancel" rule with exactly this idea
     for subscriptions
     [https://www.ftc.gov/news-events/news/press-releases/2024/10/federal-trade-commission-announces-final-click-cancel-rule-making-it-easier-consumers-end-recurring].
     A court struck it down in July 2025 for procedural reasons, and
     the FTC has started the process again
     [https://www.jonesday.com/en/insights/2026/05/ftc-revives-clicktocancel-rule-new-risks-for-subscription-businesses].

     [IMAGE: home-color.jpg + home-grayscale.jpg, side by side, next
      to P8]

     P8 (what users can do)
     Users can take back some control too. CHT reminds us that
     "notifications, alerts, and badges are designed to draw your
     attention back to your phone", and suggests turning off
     notifications, using focus modes, removing apps and keeping some
     spaces phone-free. Another tip is to set the screen to
     grayscale [https://www.humanetech.com/take-control]. In these two screenshots of the same home screen,
     the red "32" badge on the Microsoft folder jumps out in colour,
     but in grayscale it almost disappears. CHT also has a toolkit for
     people aged 13 to 25, because "Everyone who uses social media
     deserves to know how it works." [https://www.humanetech.com/youth]

     P9 (conclusion)
     Personal tricks help, but they put the whole job on the user.
     Harris and Raskin argue that the real change has to come from
     design and from the incentives behind it, because, in Raskin's
     words, "incentives eat intentions" (see the mechanics page).
