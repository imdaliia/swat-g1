     Title idea: "Designed to persuade"

     P1 (intro)
     The features described on the mechanics page are not accidents.
     Since the late 1990s researchers have studied how computers can
     change what people think and do, and designers use their models
     every day. This page introduces the two best known models and the
     business model that makes them so profitable: the attention
     economy.

     P2 (persuasive technology)
     Persuasive technology is "technology that is designed to change
     attitudes or behaviors of the users through persuasion and social
     influence, but not necessarily through coercion". In 1998
     B. J. Fogg described three ways technology can persuade: as a
     tool, as a medium and as a social actor. Whether this is
     acceptable "remains an open ethical debate", also because the
     relationship is unequal: the person being persuaded "often cannot
     respond in kind" [https://en.wikipedia.org/wiki/Persuasive_technology].

     P3 (B. J. Fogg and Stanford)
     Fogg is a social scientist at Stanford, where he founded the
     Persuasive Technology Lab, today called the Behavior Design Lab.
     In 2003 he published the book "Persuasive Technology: Using
     Computers to Change What We Think and Do". In
     2007 he co-taught a course on Facebook apps with Dave McClure;
     his students' apps reached millions of users in ten weeks.
     Among his students were Mike Krieger, who later co-founded
     Instagram, and Tristan Harris, who became one of the strongest
     critics of apps like it [https://en.wikipedia.org/wiki/B._J._Fogg]: the same lab produced both sides of
     the story.

     P4 (Fogg Behavior Model: B = MAP)
     Fogg's best known idea fits in one line, B = MAP: "Behavior happens
     when Motivation, Ability, and a Prompt come together at the same
     time. When a behavior does not occur, at least one of those three
     elements is missing." Motivation comes from three pairs:
     pleasure and pain, hope and fear, acceptance and rejection.
     Ability means how easy the action is: "Simplicity is a function of
     your scarcest resource at that moment", such as time, money,
     effort or attention. The two compensate each other: the easier
     an action is, the less motivation it needs [https://behaviormodel.org/]. This is why apps
     try to make everything one tap away.

     [IMAGE: home-color.jpg (reused from the alternatives page),
      next to P5]

     P5 (the prompt)
     The third element is the prompt: "Prompts tell people to 'do it
     now!'". Fogg called it "trigger" until 2017 [https://behaviormodel.org/]. On a phone,
     the most common prompt is the notification badge: the red "32" on
     the app folder in this screenshot is there to make you open it.

     P6 (Nir Eyal's Hook Model)
     Nir Eyal turned these ideas into a recipe in four steps: trigger,
     action, variable reward, investment. A trigger can be external
     (an email, a link, an app icon) or internal, a feeling that, after
     many repetitions, becomes linked to the app. The action must be
     as easy as possible, following Fogg. The reward is variable,
     like a slot machine (see the mechanics page). Finally the user
     invests "time, data, effort, social capital or money", such as
     followers, posts and preferences, which makes the app harder to
     leave [https://www.nirandfar.com/how-to-manufacture-desire/]. Eyal
     published his book "Hooked: How to Build Habit-Forming Products"
     in 2014 [https://en.wikipedia.org/wiki/Nir_Eyal] as a guide for
     product designers, and that is exactly what makes it interesting
     for an ethics page.

     [IMAGE: herbert-simon.jpg, next to P7, with the 1971 quote]

     P7 (attention economy)
     Why do companies want our habits? Because of the attention
     economy: "the incentives of advertising-driven companies, in
     particular, to maximize the time and attention their users give to
     their product". The economist Herbert Simon saw the problem
     already in 1971: "a wealth of information creates a poverty of
     attention and a need to allocate that attention efficiently among
     the overabundance of information sources that might consume it".
     In the mid-1990s Thomas H. Davenport and Michael Goldhaber
     started writing about an "attention economy" [https://en.wikipedia.org/wiki/Attention_economy].

     P8 (conclusion)
     Persuasive design is not bad in itself: the same models can help
     people build good habits. The problem starts when the goal is not
     the user's, but the advertiser's. The next page looks at what this
     costs users.
